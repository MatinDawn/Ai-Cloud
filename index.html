<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .app {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  /* ---- Header ---- */
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 28px 24px 24px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .header p {
    font-size: 13px;
    opacity: 0.8;
  }

  /* ---- Input row ---- */
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-bottom: 1px solid #f0f0f0;
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #e8e8e8;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: #667eea; }
  .input-row button {
    padding: 10px 20px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .input-row button:hover { background: #5568d3; }
  .input-row button:active { background: #4457b0; }

  /* ---- Todo list ---- */
  .todo-list { list-style: none; padding: 8px 0; max-height: 420px; overflow-y: auto; }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    transition: background 0.15s;
  }
  .todo-item:hover { background: #f9f9fc; }

  /* Custom checkbox */
  .todo-item .check {
    width: 22px; height: 22px;
    border: 2px solid #d0d0e0;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .todo-item.done .check {
    background: #667eea;
    border-color: #667eea;
  }
  .todo-item.done .check::after {
    content: '';
    width: 6px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .todo-item .text {
    flex: 1;
    font-size: 15px;
    color: #333;
    line-height: 1.4;
    word-break: break-word;
  }
  .todo-item.done .text {
    color: #aaa;
    text-decoration: line-through;
  }

  .todo-item .del {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .todo-item .del:hover { background: #fee; color: #e74c3c; }

  /* ---- Empty state ---- */
  .empty {
    text-align: center;
    padding: 40px 24px;
    color: #bbb;
    font-size: 14px;
  }

  /* ---- Footer ---- */
  .footer {
    padding: 14px 24px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #999;
  }
  .footer .clear-btn {
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .footer .clear-btn:hover { background: #fee; }
  .footer .clear-btn:disabled { color: #ddd; cursor: default; }
  .footer .clear-btn:disabled:hover { background: none; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>📋 待办清单</h1>
    <p>记录你要做的事，逐个搞定</p>
  </div>

  <div class="input-row">
    <input type="text" id="todoInput" placeholder="输入待办事项，按回车添加…" maxlength="200">
    <button id="addBtn">添加</button>
  </div>

  <ul class="todo-list" id="todoList"></ul>

  <div class="footer">
    <span id="countText">共 0 项，未完成 0 项</span>
    <button class="clear-btn" id="clearBtn" disabled>清除已完成</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todo-list-data";
  var input    = document.getElementById("todoInput");
  var addBtn   = document.getElementById("addBtn");
  var listEl   = document.getElementById("todoList");
  var countEl  = document.getElementById("countText");
  var clearBtn = document.getElementById("clearBtn");

  var todos = [];

  /* ---- persistence ---- */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) todos = JSON.parse(raw);
    } catch (e) { todos = []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  /* ---- render ---- */
  function render() {
    listEl.innerHTML = "";

    if (todos.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "🎉 暂无待办，添加一个开始吧";
      listEl.appendChild(empty);
    } else {
      todos.forEach(function (todo, i) {
        var li = document.createElement("li");
        li.className = "todo-item" + (todo.done ? " done" : "");

        // checkbox circle
        var check = document.createElement("div");
        check.className = "check";
        check.addEventListener("click", function () { toggle(i); });

        // text
        var span = document.createElement("span");
        span.className = "text";
        span.textContent = todo.text;

        // delete button
        var del = document.createElement("button");
        del.className = "del";
        del.innerHTML = "&times;";
        del.title = "删除";
        del.addEventListener("click", function () { remove(i); });

        li.appendChild(check);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    // footer counts
    var total = todos.length;
    var undone = todos.filter(function (t) { return !t.done; }).length;
    countEl.textContent = "共 " + total + " 项，未完成 " + undone + " 项";
    clearBtn.disabled = (total - undone) === 0;
  }

  /* ---- actions ---- */
  function add() {
    var text = input.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false });
    input.value = "";
    save();
    render();
  }
  function toggle(i) {
    todos[i].done = !todos[i].done;
    save();
    render();
  }
  function remove(i) {
    todos.splice(i, 1);
    save();
    render();
  }
  function clearDone() {
    todos = todos.filter(function (t) { return !t.done; });
    save();
    render();
  }

  /* ---- events ---- */
  addBtn.addEventListener("click", add);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") add();
  });
  clearBtn.addEventListener("click", clearDone);

  /* ---- init ---- */
  load();
  render();
})();
</script>
</body>
</html>
